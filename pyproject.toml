[project]
name = "codequality"
version = "0.1.0"
description = "Grade a project against a personal set of code quality rules"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.26",  # 0.26.0 crashes (segmentation fault) on large Rust files
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-hare",  # vendored: the grammar has no PyPI release
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-go>=0.25,<0.26",
]

[tool.setuptools.packages.find]
include = ["codequality*"]  # keeps the vendored grammar out of this package

[tool.uv.sources]
tree-sitter-hare = { path = "vendor/tree-sitter-hare" }

[dependency-groups]
dev = ["pytest"]

[project.scripts]
codequality = "codequality.cli:main"
