[project]
name = "codequality"
version = "0.1.0"
description = "Grade a project against a personal set of code quality rules"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.26",  # 0.26.0 crashes (segmentation fault) on large Rust files
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-hare",  # vendored: the grammar has no PyPI release
    "tree-sitter-mojo",  # vendored: same reason
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-fortran>=0.6,<0.7",
    "tree-sitter-c-sharp>=0.23,<0.24",
]

[tool.setuptools.packages.find]
include = ["codequality*"]  # keeps the vendored grammar out of this package

[tool.uv.sources]
tree-sitter-hare = { path = "vendor/tree-sitter-hare" }
tree-sitter-mojo = { path = "vendor/tree-sitter-mojo" }

[dependency-groups]
dev = ["pytest"]

[project.scripts]
codequality = "codequality.cli:main"

[tool.ruff]
line-length = 200  # the code is written with long lines on purpose, so this matches it instead of fighting it
extend-exclude = ["vendor"]  # copied-in grammars are not ours to lint

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import order
ignore = ["E501"]  # line length is judged by this project's own rules

[tool.ruff.lint.per-file-ignores]
"codequality/rules/__init__.py" = ["F401"]  # these imports are what registers the rules, so they look unused

[tool.ruff.lint.isort]
lines-after-imports = 1  # rule 14 never allows two blank lines in a row
