[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-mojo"
description = "Mojo grammar for tree-sitter, built from github.com/forfudan/tree-sitter-mojo (commit 61cb25c)"
version = "0.0.1"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["tree_sitter_mojo"]
